<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel - Add Stream</title>
    <link rel="apple-touch-icon" href="https://alexxit.github.io/go2rtc/icons/apple-touch-icon-180x180.png"
        sizes="180x180">
    <link rel="icon" href="https://alexxit.github.io/go2rtc/icons/favicon.ico">
    <link rel="manifest" href="https://alexxit.github.io/go2rtc/manifest.json">

    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>

    <script>
        // FOUC Mitigation & Tailwind Config
        (function () {
            const storedPreference = localStorage.getItem('darkMode');
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (storedPreference === 'enabled' || (!storedPreference && systemPrefersDark)) {
                document.documentElement.classList.add('dark');
            }
            tailwind.config = {
                darkMode: 'class',
                theme: {
                    extend: {
                        colors: {
                            'sentinel-accent': '#020817',
                        },
                    }, // Corrected: Added closing brace for extend
                }, // Corrected: Added closing brace for theme
            }; // Corrected: Added semicolon for assignment
        })();
    </script>
</head>

<body
    class="bg-gray-100 text-gray-800 dark:bg-slate-900 dark:text-gray-100 font-sans antialiased transition-colors duration-300"
    x-data="appState()" x-init="init()" x-cloak>
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 bg-sentinel-accent text-white p-3 flex flex-col flex-shrink-0 hs-accordion-group">
            <div class="text-2xl font-semibold text-center text-gray-100 py-3 mb-2">
                Sentinel
            </div>
            <nav class="flex-grow space-y-1">
                <a href="index.html"
                    class="hs-accordion-toggle flex items-center gap-x-3 py-2 px-3 text-sm text-slate-300 rounded-md hover:bg-slate-700/70 hover:text-gray-100">
                    <svg class="flex-shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                        <polyline points="9 22 9 12 15 12 15 22" />
                    </svg>
                    Streams
                </a>
                <a href="add.html"
                    class="hs-accordion-toggle flex items-center gap-x-3 py-2 px-3 text-sm text-gray-100 rounded-md hover:bg-slate-700/70 bg-slate-700/40 font-medium">
                    <svg class="flex-shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M5 12h14" />
                        <path d="M12 5v14" />
                    </svg>
                    Add Stream
                </a>
                <a href="editor.html"
                    class="hs-accordion-toggle flex items-center gap-x-3 py-2 px-3 text-sm text-slate-300 rounded-md hover:bg-slate-700/70 hover:text-gray-100">
                    <svg class="flex-shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" />
                        <path d="m15 5 4 4" />
                    </svg>
                    Config Editor
                </a>
                <a href="log.html"
                    class="hs-accordion-toggle flex items-center gap-x-3 py-2 px-3 text-sm text-slate-300 rounded-md hover:bg-slate-700/70 hover:text-gray-100">
                    <svg class="flex-shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <rect width="10" height="18" x="7" y="3" rx="2" />
                        <path d="M10 9.5c-2-.3-4.5-1-4.5-3.5C5.5 4 7 3 7 3S9 3 9 4c0 .9-.5 1.4-1 1.8" />
                        <path d="M14 9.5c2-.3 4.5-1 4.5-3.5C18.5 4 17 3 17 3s-2 0-2 1c0 .9.5 1.4 1 1.8" />
                        <path d="M7 15a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-2.5H7Z" />
                    </svg>
                    View Log
                </a>
                <a href="network.html"
                    class="hs-accordion-toggle flex items-center gap-x-3 py-2 px-3 text-sm text-slate-300 rounded-md hover:bg-slate-700/70 hover:text-gray-100">
                    <svg class="flex-shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M2 13a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2v-4a2 2 0 0 0-2-2Z" />
                        <path d="M5 13V7a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v6" />
                        <path d="M12 13v4" />
                        <path d="M12 5v-2M12 21v-2M20 13h2M2 13H0M7 13h0M17 13h0" />
                    </svg>
                    Network Info
                </a>
            </nav>
            <div class="mt-auto pt-3 border-t border-slate-700">
                <button @click="toggleDarkMode()"
                    class="w-full flex items-center justify-center gap-x-2 py-2 px-3 text-sm text-slate-300 rounded-md hover:bg-slate-700/70 hover:text-gray-100 focus:outline-none focus:ring-1 focus:ring-gray-600">
                    <span x-html="isDarkMode ? '&#9728;&#65039;' : '&#127765;'"></span>
                    <span x-text="isDarkMode ? 'Light Mode' : 'Dark Mode'"></span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col overflow-hidden" x-data="addStreamState()">
            <div
                class="bg-white dark:bg-slate-800/80 shadow-sm py-2.5 px-4 sm:px-5 lg:px-6 border-b border-gray-200 dark:border-slate-700/80">
                <h1 class="text-base sm:text-lg font-semibold text-gray-800 dark:text-gray-200">Add New Stream Source
                </h1>
            </div>

            <div class="flex-1 flex overflow-hidden">
                <!-- Source Type Navigation -->
                <div
                    class="w-1/5 min-w-[180px] bg-white dark:bg-slate-800/80 border-r border-gray-200 dark:border-slate-700/80 p-3 overflow-y-auto">
                    <h2 class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2.5">
                        Source Types</h2>
                    <nav class="flex flex-col space-y-1">
                        <template x-for="source in sources" :key="source.id">
                            <button @click="setActiveSource(source.id)"
                                :class="{ 'bg-blue-500 text-white font-medium shadow-sm': activeSource === source.id, 'hover:bg-gray-100 dark:hover:bg-slate-700/60 text-slate-600 dark:text-slate-300 hover:text-slate-800 dark:hover:text-slate-100': activeSource !== source.id }"
                                class="w-full text-left py-1.5 px-2.5 rounded-md text-sm transition-colors duration-150">
                                <span x-text="source.name"></span>
                            </button>
                        </template>
                    </nav>
                </div>

                <!-- Source Configuration Area -->
                <div class="flex-1 p-4 sm:p-5 lg:p-6 overflow-y-auto">
                    <div class="max-w-3xl mx-auto relative min-h-[36rem]">
                        <!-- Generic Stream Form -->
                        <div x-show="activeSource === 'stream'" x-transition:enter="transition ease-out duration-200"
                            x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
                            x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100"
                            x-transition:leave-end="opacity-0" class="absolute inset-0 w-full">
                            <div
                                class="bg-white border border-gray-200 shadow-sm rounded-lg p-4 md:p-5 dark:bg-slate-900/70 dark:border-gray-700/80">
                                <h3 class="text-base font-semibold text-gray-800 dark:text-white mb-3.5">Add Temporary
                                    Stream</h3>
                                <form @submit.prevent="addTemporaryStream" class="space-y-3.5">
                                    <div>
                                        <label for="stream-name"
                                            class="block text-xs font-medium mb-1.5 dark:text-gray-300">Stream
                                            Name</label>
                                        <input type="text" id="stream-name" x-model="forms.stream.name"
                                            placeholder="e.g., front-door-cam"
                                            class="py-2 px-3 block w-full bg-gray-100 border-gray-300 dark:border-gray-600 rounded-md text-sm focus:border-blue-500 disabled:opacity-50 disabled:pointer-events-none dark:bg-slate-800 dark:text-gray-300 dark:focus:border-blue-500">
                                    </div>
                                    <div>
                                        <label for="stream-url"
                                            class="block text-xs font-medium mb-1.5 dark:text-gray-300">Source
                                            URL</label>
                                        <input type="text" id="stream-url" x-model="forms.stream.src"
                                            placeholder="rtsp://..."
                                            class="py-2 px-3 block w-full bg-gray-100 border-gray-300 dark:border-gray-600 rounded-md text-sm focus:border-blue-500 disabled:opacity-50 disabled:pointer-events-none dark:bg-slate-800 dark:text-gray-300 dark:focus:border-blue-500">
                                    </div>
                                    <div class="text-right pt-1">
                                        <button type="submit"
                                            class="py-2 px-3 inline-flex items-center gap-x-2 text-sm font-medium rounded-md border border-transparent bg-blue-600 text-white hover:bg-blue-700 disabled:opacity-50 disabled:pointer-events-none">Add
                                            Stream</button>
                                    </div>
                                </form>
                            </div>
                        </div>

                        <!-- ONVIF Form & Table -->
                        <div x-show="activeSource === 'onvif'" x-transition:enter="transition ease-out duration-200"
                            x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
                            x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100"
                            x-transition:leave-end="opacity-0" class="absolute inset-0 w-full">
                            <div
                                class="bg-white border border-gray-200 shadow-sm rounded-lg p-4 md:p-5 dark:bg-slate-900/70 dark:border-gray-700/80">
                                <h3 class="text-base font-semibold text-gray-800 dark:text-white mb-3.5">Discover ONVIF
                                    Devices</h3>
                                <form @submit.prevent="discoverOnvif" class="space-y-3.5 mb-5">
                                    <div>
                                        <label for="onvif-url"
                                            class="block text-xs font-medium mb-1.5 dark:text-gray-300">Device Address
                                            (optional)</label>
                                        <input type="text" id="onvif-url" x-model="forms.onvif.src"
                                            placeholder="onvif://user:pass@192.168.1.123"
                                            class="py-2 px-3 block w-full bg-gray-100 border-gray-300 dark:border-gray-600 rounded-md text-sm focus:border-blue-500 disabled:opacity-50 disabled:pointer-events-none dark:bg-slate-800 dark:text-gray-300 dark:focus:border-blue-500">
                                    </div>
                                    <div class="text-right pt-1">
                                        <button type="submit"
                                            class="py-2 px-3 inline-flex items-center gap-x-2 text-sm font-medium rounded-md border border-transparent bg-blue-600 text-white hover:bg-blue-700 disabled:opacity-50 disabled:pointer-events-none">Discover</button>
                                    </div>
                                </form>
                                <div x-html="renderTable(tables.onvif, 'onvif')"></div>
                            </div>
                        </div>

                        <!-- HomeKit Form & Table -->
                        <div x-show="activeSource === 'homekit'" x-transition:enter="transition ease-out duration-200"
                            x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
                            x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100"
                            x-transition:leave-end="opacity-0" class="absolute inset-0 w-full">
                            <div
                                class="bg-white border border-gray-200 shadow-sm rounded-lg p-4 md:p-5 dark:bg-slate-900/70 dark:border-gray-700/80">
                                <h3 class="text-base font-semibold text-gray-800 dark:text-white mb-3.5">Apple HomeKit
                                </h3>
                                <form @submit.prevent="submitHomekitPair"
                                    class="space-y-3.5 mb-5 border-b border-gray-200 dark:border-gray-700/80 pb-5">
                                    <h4 class="text-sm font-medium text-gray-700 dark:text-gray-300">Pair Device</h4>
                                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3.5">
                                        <div>
                                            <label class="block text-xs font-medium mb-1.5 dark:text-gray-300">Stream
                                                ID</label>
                                            <input type="text" x-model="forms.homekit.pair.id" placeholder="stream id"
                                                class="py-2 px-3 block w-full bg-gray-100 border-gray-300 dark:border-gray-600 rounded-md text-sm focus:border-blue-500 dark:bg-slate-800 dark:text-gray-300">
                                        </div>
                                        <div>
                                            <label
                                                class="block text-xs font-medium mb-1.5 dark:text-gray-300">URL</label>
                                            <input type="text" x-model="forms.homekit.pair.url" placeholder="url"
                                                class="py-2 px-3 block w-full bg-gray-100 border-gray-300 dark:border-gray-600 rounded-md text-sm focus:border-blue-500 dark:bg-slate-800 dark:text-gray-300">
                                        </div>
                                        <div>
                                            <label
                                                class="block text-xs font-medium mb-1.5 dark:text-gray-300">PIN</label>
                                            <input type="text" x-model="forms.homekit.pair.pin" placeholder="pin"
                                                class="py-2 px-3 block w-full bg-gray-100 border-gray-300 dark:border-gray-600 rounded-md text-sm focus:border-blue-500 dark:bg-slate-800 dark:text-gray-300">
                                        </div>
                                    </div>
                                    <div class="text-right pt-1">
                                        <button type="submit"
                                            class="py-2 px-3 inline-flex items-center gap-x-2 text-sm font-medium rounded-md border border-transparent bg-blue-600 text-white hover:bg-blue-700">Pair</button>
                                    </div>
                                </form>
                                <form @submit.prevent="submitHomekitUnpair" class="space-y-3.5 mb-5">
                                    <h4 class="text-sm font-medium text-gray-700 dark:text-gray-300">Unpair Device</h4>
                                    <div>
                                        <label class="block text-xs font-medium mb-1.5 dark:text-gray-300">Stream
                                            ID</label>
                                        <input type="text" x-model="forms.homekit.unpair.id" placeholder="stream id"
                                            class="py-2 px-3 block w-full bg-gray-100 border-gray-300 dark:border-gray-600 rounded-md text-sm focus:border-blue-500 dark:bg-slate-800 dark:text-gray-300">
                                    </div>
                                    <div class="text-right pt-1">
                                        <button type="submit"
                                            class="py-2 px-3 inline-flex items-center gap-x-2 text-sm font-medium rounded-md border border-transparent bg-red-600 text-white hover:bg-red-700">Unpair</button>
                                    </div>
                                </form>
                                <div x-html="renderTable(tables.homekit, 'homekit')"></div>
                            </div>
                        </div>

                        <!-- Google Nest Form & Table -->
                        <div x-show="activeSource === 'nest'" x-transition:enter="transition ease-out duration-200"
                            x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
                            x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100"
                            x-transition:leave-end="opacity-0" class="absolute inset-0 w-full">
                            <div
                                class="bg-white border border-gray-200 shadow-sm rounded-lg p-4 md:p-5 dark:bg-slate-900/70 dark:border-gray-700/80">
                                <h3 class="text-base font-semibold text-gray-800 dark:text-white mb-3.5">Google Nest
                                </h3>
                                <form @submit.prevent="submitNestLogin" class="space-y-3.5 mb-5">
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5">
                                        <div>
                                            <label class="block text-xs font-medium mb-1.5 dark:text-gray-300">Client
                                                ID</label>
                                            <input type="text" x-model="forms.nest.client_id"
                                                class="py-2 px-3 block w-full bg-gray-100 border-gray-300 dark:border-gray-600 rounded-md text-sm focus:border-blue-500 dark:bg-slate-800 dark:text-gray-300">
                                        </div>
                                        <div>
                                            <label class="block text-xs font-medium mb-1.5 dark:text-gray-300">Client
                                                Secret</label>
                                            <input type="text" x-model="forms.nest.client_secret"
                                                class="py-2 px-3 block w-full bg-gray-100 border-gray-300 dark:border-gray-600 rounded-md text-sm focus:border-blue-500 dark:bg-slate-800 dark:text-gray-300">
                                        </div>
                                        <div>
                                            <label class="block text-xs font-medium mb-1.5 dark:text-gray-300">Refresh
                                                Token</label>
                                            <input type="text" x-model="forms.nest.refresh_token"
                                                class="py-2 px-3 block w-full bg-gray-100 border-gray-300 dark:border-gray-600 rounded-md text-sm focus:border-blue-500 dark:bg-slate-800 dark:text-gray-300">
                                        </div>
                                        <div>
                                            <label class="block text-xs font-medium mb-1.5 dark:text-gray-300">Project
                                                ID</label>
                                            <input type="text" x-model="forms.nest.project_id"
                                                class="py-2 px-3 block w-full bg-gray-100 border-gray-300 dark:border-gray-600 rounded-md text-sm focus:border-blue-500 dark:bg-slate-800 dark:text-gray-300">
                                        </div>
                                    </div>
                                    <div class="text-right pt-1">
                                        <button type="submit"
                                            class="py-2 px-3 inline-flex items-center gap-x-2 text-sm font-medium rounded-md border border-transparent bg-blue-600 text-white hover:bg-blue-700">Login</button>
                                    </div>
                                </form>
                                <div x-html="renderTable(tables.nest, 'nest')"></div>
                            </div>
                        </div>

                        <!-- Ring Form & Table -->
                        <div x-show="activeSource === 'ring'" x-transition:enter="transition ease-out duration-200"
                            x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
                            x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100"
                            x-transition:leave-end="opacity-0" class="absolute inset-0 w-full">
                            <div
                                class="bg-white border border-gray-200 shadow-sm rounded-lg p-4 md:p-5 dark:bg-slate-900/70 dark:border-gray-700/80">
                                <h3 class="text-base font-semibold text-gray-800 dark:text-white mb-3.5">Ring</h3>
                                <form @submit.prevent="submitRingCredentials"
                                    class="space-y-3.5 mb-5 border-b border-gray-200 dark:border-gray-700/80 pb-5">
                                    <h4 class="text-sm font-medium text-gray-700 dark:text-gray-300">Login with
                                        Credentials</h4>
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5">
                                        <div>
                                            <label
                                                class="block text-xs font-medium mb-1.5 dark:text-gray-300">Email</label>
                                            <input type="email" x-model="forms.ring.credentials.email"
                                                class="py-2 px-3 block w-full bg-gray-100 border-gray-300 dark:border-gray-600 rounded-md text-sm focus:border-blue-500 dark:bg-slate-800 dark:text-gray-300">
                                        </div>
                                        <div>
                                            <label
                                                class="block text-xs font-medium mb-1.5 dark:text-gray-300">Password</label>
                                            <input type="password" x-model="forms.ring.credentials.password"
                                                class="py-2 px-3 block w-full bg-gray-100 border-gray-300 dark:border-gray-600 rounded-md text-sm focus:border-blue-500 dark:bg-slate-800 dark:text-gray-300">
                                        </div>
                                    </div>
                                    <div x-show="forms.ring.show2FA" class="mt-3.5">
                                        <label class="block text-xs font-medium mb-1.5 dark:text-gray-300">2FA
                                            Code</label>
                                        <input type="text" x-model="forms.ring.credentials.code"
                                            class="py-2 px-3 block w-full bg-gray-100 border-gray-300 dark:border-gray-600 rounded-md text-sm focus:border-blue-500 dark:bg-slate-800 dark:text-gray-300">
                                        <p x-show="forms.ring.tfaPrompt" x-text="forms.ring.tfaPrompt"
                                            class="mt-1 text-xs text-gray-500 dark:text-gray-400"></p>
                                    </div>
                                    <div class="text-right pt-1">
                                        <button type="submit"
                                            class="py-2 px-3 inline-flex items-center gap-x-2 text-sm font-medium rounded-md border border-transparent bg-blue-600 text-white hover:bg-blue-700">Login</button>
                                    </div>
                                </form>
                                <form @submit.prevent="submitRingToken" class="space-y-3.5 mb-5">
                                    <h4 class="text-sm font-medium text-gray-700 dark:text-gray-300">Login with Refresh
                                        Token</h4>
                                    <div>
                                        <label class="block text-xs font-medium mb-1.5 dark:text-gray-300">Refresh
                                            Token</label>
                                        <input type="text" x-model="forms.ring.token.refresh_token"
                                            class="py-2 px-3 block w-full bg-gray-100 border-gray-300 dark:border-gray-600 rounded-md text-sm focus:border-blue-500 dark:bg-slate-800 dark:text-gray-300">
                                    </div>
                                    <div class="text-right pt-1">
                                        <button type="submit"
                                            class="py-2 px-3 inline-flex items-center gap-x-2 text-sm font-medium rounded-md border border-transparent bg-blue-600 text-white hover:bg-blue-700">Login</button>
                                    </div>
                                </form>
                                <div x-html="renderTable(tables.ring, 'ring')"></div>
                            </div>
                        </div>

                        <!-- Roborock Form & Table -->
                        <div x-show="activeSource === 'roborock'" x-transition:enter="transition ease-out duration-200"
                            x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
                            x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100"
                            x-transition:leave-end="opacity-0" class="absolute inset-0 w-full">
                            <div
                                class="bg-white border border-gray-200 shadow-sm rounded-lg p-4 md:p-5 dark:bg-slate-900/70 dark:border-gray-700/80">
                                <h3 class="text-base font-semibold text-gray-800 dark:text-white mb-3.5">Roborock</h3>
                                <form @submit.prevent="submitRoborockLogin" class="space-y-3.5 mb-5">
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5">
                                        <div>
                                            <label
                                                class="block text-xs font-medium mb-1.5 dark:text-gray-300">Username</label>
                                            <input type="text" x-model="forms.roborock.username"
                                                class="py-2 px-3 block w-full bg-gray-100 border-gray-300 dark:border-gray-600 rounded-md text-sm focus:border-blue-500 dark:bg-slate-800 dark:text-gray-300">
                                        </div>
                                        <div>
                                            <label
                                                class="block text-xs font-medium mb-1.5 dark:text-gray-300">Password</label>
                                            <input type="password" x-model="forms.roborock.password"
                                                class="py-2 px-3 block w-full bg-gray-100 border-gray-300 dark:border-gray-600 rounded-md text-sm focus:border-blue-500 dark:bg-slate-800 dark:text-gray-300">
                                        </div>
                                    </div>
                                    <div class="text-right pt-1">
                                        <button type="submit"
                                            class="py-2 px-3 inline-flex items-center gap-x-2 text-sm font-medium rounded-md border border-transparent bg-blue-600 text-white hover:bg-blue-700">Login</button>
                                    </div>
                                </form>
                                <div x-html="renderTable(tables.roborock, 'roborock')"></div>
                            </div>
                        </div>

                        <!-- Other simple source types -->
                        <template
                            x-for="source in sources.filter(s => !['stream', 'onvif', 'homekit', 'nest', 'ring', 'roborock'].includes(s.id))"
                            :key="source.id">
                            <div x-show="activeSource === source.id"
                                x-transition:enter="transition ease-out duration-200"
                                x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
                                x-transition:leave="transition ease-in duration-150"
                                x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
                                class="absolute inset-0 w-full">
                                <div
                                    class="bg-white border border-gray-200 shadow-sm rounded-lg p-4 md:p-5 dark:bg-slate-900/70 dark:border-gray-700/80">
                                    <h3 class="text-base font-semibold text-gray-800 dark:text-white mb-3.5"
                                        x-text="`Available ${source.name} Sources`"></h3>
                                    <div x-html="renderTable(tables[source.id], source.id)"></div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="main.js"></script>
    <script src="add.js"></script>

</body>

</html>
