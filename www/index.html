<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel - Camera Streams</title>
    <link rel="apple-touch-icon" href="https://alexxit.github.io/go2rtc/icons/apple-touch-icon-180x180.png" sizes="180x180">
    <link rel="icon" href="https://alexxit.github.io/go2rtc/icons/favicon.ico">
    <link rel="manifest" href="https://alexxit.github.io/go2rtc/manifest.json">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>

    <script>
        // FOUC Mitigation & Tailwind Config
        (function() {
            const storedPreference = localStorage.getItem('darkMode');
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (storedPreference === 'enabled' || (!storedPreference && systemPrefersDark)) {
                document.documentElement.classList.add('dark');
            }
            tailwind.config = {
                darkMode: 'class',
                theme: {
                    extend: {
                        colors: {
                            'sentinel-accent': '#020817',
                        }
                    }
                }
            }
        })();
    </script>
</head>
<body class="bg-gray-100 text-gray-800 dark:bg-slate-900 dark:text-gray-100 font-sans antialiased transition-colors duration-300" x-data="appState()" x-init="init()" x-cloak>
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 bg-sentinel-accent text-white p-3 flex flex-col flex-shrink-0 hs-accordion-group">
            <div class="text-2xl font-semibold text-center text-gray-100 py-3 mb-2">
                Sentinel
            </div>

            <nav class="flex-grow space-y-1">
                <a href="index.html" class="hs-accordion-toggle flex items-center gap-x-3 py-2 px-3 text-sm text-gray-100 rounded-md hover:bg-slate-700/70 bg-slate-700/40 font-medium">
                    <svg class="flex-shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    Streams
                </a>
                <a href="add.html" class="hs-accordion-toggle flex items-center gap-x-3 py-2 px-3 text-sm text-slate-300 rounded-md hover:bg-slate-700/70 hover:text-gray-100">
                    <svg class="flex-shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                    Add Stream
                </a>
                <a href="editor.html" class="hs-accordion-toggle flex items-center gap-x-3 py-2 px-3 text-sm text-slate-300 rounded-md hover:bg-slate-700/70 hover:text-gray-100">
                   <svg class="flex-shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
                    Config Editor
                </a>
                <a href="log.html" class="hs-accordion-toggle flex items-center gap-x-3 py-2 px-3 text-sm text-slate-300 rounded-md hover:bg-slate-700/70 hover:text-gray-100">
                    <svg class="flex-shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="10" height="18" x="7" y="3" rx="2"/><path d="M10 9.5c-2-.3-4.5-1-4.5-3.5C5.5 4 7 3 7 3S9 3 9 4c0 .9-.5 1.4-1 1.8"/><path d="M14 9.5c2-.3 4.5-1 4.5-3.5C18.5 4 17 3 17 3s-2 0-2 1c0 .9.5 1.4 1 1.8"/><path d="M7 15a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-2.5H7Z"/></svg>
                    View Log
                </a>
                <a href="network.html" class="hs-accordion-toggle flex items-center gap-x-3 py-2 px-3 text-sm text-slate-300 rounded-md hover:bg-slate-700/70 hover:text-gray-100">
                    <svg class="flex-shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 13a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2v-4a2 2 0 0 0-2-2Z"/><path d="M5 13V7a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v6"/><path d="M12 13v4"/><path d="M12 5v-2M12 21v-2M20 13h2M2 13H0M7 13h0M17 13h0"/></svg>
                    Network Info
                </a>
            </nav>

            <div class="mt-auto pt-3 border-t border-slate-700">
                <button @click="toggleDarkMode()"
                        class="w-full flex items-center justify-center gap-x-2 py-2 px-3 text-sm text-slate-300 rounded-md hover:bg-slate-700/70 hover:text-gray-100 focus:outline-none focus:ring-1 focus:ring-gray-600">
                    <span x-html="isDarkMode ? '&#9728;&#65039;' : '&#127765;'"></span>
                    <span x-text="isDarkMode ? 'Light Mode' : 'Dark Mode'"></span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col overflow-hidden">
            <!-- Info Bar -->
            <div class="bg-white dark:bg-slate-800/80 shadow-sm p-3 border-b border-gray-200 dark:border-slate-700/80">
                <p class="text-xs text-gray-500 dark:text-gray-400">
                    Version: <span x-text="versionInfo" class="font-medium text-gray-700 dark:text-gray-300"></span> |
                    Config: <span x-text="configPathInfo" class="font-medium text-gray-700 dark:text-gray-300"></span>
                </p>
            </div>

            <!-- Stream Table Area -->
            <div class="flex-1 p-4 sm:p-5 lg:p-6 overflow-y-auto">
                <div class="bg-white border border-gray-200 shadow-sm rounded-lg dark:bg-slate-900/70 dark:border-gray-700/80">
                    <div class="px-4 py-3 sm:px-5 border-b border-gray-200 dark:border-gray-700/80">
                        <h2 class="text-base font-semibold text-gray-800 dark:text-gray-200">
                            Available Streams
                        </h2>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-700/80">
                            <thead class="bg-gray-50 dark:bg-slate-800/60">
                                <tr>
                                    <th scope="col" class="ps-5 py-2.5 text-start w-10">
                                        <label class="flex">
                                            <input type="checkbox" @change="toggleSelectAll($event.target.checked)" :checked="selectAll"
                                                   class="shrink-0 mt-0.5 border-gray-300 dark:border-gray-600 rounded text-blue-600 focus:ring-blue-500 disabled:opacity-50 disabled:pointer-events-none dark:bg-slate-900 dark:checked:bg-blue-500 dark:checked:border-blue-500 dark:focus:ring-offset-gray-800">
                                            <span class="sr-only">Select all</span>
                                        </label>
                                    </th>
                                    <th scope="col" class="px-4 py-2.5 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Name</th>
                                    <th scope="col" class="px-4 py-2.5 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Status</th>
                                    <th scope="col" class="px-4 py-2.5 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Actions</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-200 dark:divide-gray-700/80">
                                <template x-if="streams.length === 0 && !initialLoading">
                                    <tr>
                                        <td colspan="4" class="px-4 py-10 text-center text-sm text-gray-500 dark:text-gray-400">
                                            No streams available.
                                        </td>
                                    </tr>
                                </template>
                                <template x-if="initialLoading">
                                    <tr>
                                        <td colspan="4" class="px-4 py-10 text-center text-sm text-gray-500 dark:text-gray-400">
                                            <div class="animate-spin inline-block size-5 border-[3px] border-current border-t-transparent text-blue-600 rounded-full" role="status" aria-label="loading">
                                                <span class="sr-only">Loading...</span>
                                            </div>
                                            <span class="ml-2">Loading streams...</span>
                                        </td>
                                    </tr>
                                </template>
                                <template x-for="stream in streams" :key="stream.id">
                                    <tr class="hover:bg-gray-50/70 dark:hover:bg-slate-800/40">
                                        <td class="ps-5 py-3 whitespace-nowrap">
                                            <input type="checkbox" x-model="stream.checked" @change="updateStreamSelection(stream.name)"
                                                   class="shrink-0 mt-0.5 border-gray-300 dark:border-gray-600 rounded text-blue-600 focus:ring-blue-500 disabled:opacity-50 disabled:pointer-events-none dark:bg-slate-900 dark:checked:bg-blue-500 dark:checked:border-blue-500 dark:focus:ring-offset-gray-800">
                                        </td>
                                        <td class="px-4 py-3 whitespace-nowrap text-sm font-medium text-gray-800 dark:text-gray-200" x-text="stream.name"></td>
                                        <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-500 dark:text-gray-400">
                                            <span class="inline-flex items-center gap-x-1.5 py-0.5 px-2 rounded-full text-xs font-medium"
                                                  :class="stream.online > 0 ? 'bg-teal-100 text-teal-800 dark:bg-teal-500/10 dark:text-teal-500' : 'bg-red-100 text-red-800 dark:bg-red-500/10 dark:text-red-500'">
                                                <span class="size-1.5 inline-block rounded-full" :class="stream.online > 0 ? 'bg-teal-800 dark:bg-teal-500' : 'bg-red-800 dark:bg-red-500'"></span>
                                                <span x-text="stream.online + ' online'"></span>
                                            </span>
                                            <a :href="stream.infoLink" target="_blank" class="ml-1.5 text-xs text-blue-600 hover:text-blue-700 dark:text-blue-500 dark:hover:text-blue-400 hover:underline">info</a>
                                            <span class="text-gray-300 dark:text-gray-600 mx-0.5">/</span>
                                            <a :href="stream.probeLink" target="_blank" class="text-xs text-blue-600 hover:text-blue-700 dark:text-blue-500 dark:hover:text-blue-400 hover:underline">probe</a>
                                            <span class="text-gray-300 dark:text-gray-600 mx-0.5">/</span>
                                            <a :href="stream.netLink" target="_blank" class="text-xs text-blue-600 hover:text-blue-700 dark:text-blue-500 dark:hover:text-blue-400 hover:underline">net</a>
                                        </td>
                                        <td class="px-4 py-3 whitespace-nowrap text-sm font-medium">
                                            <a :href="'stream.html?src=' + stream.src" class="py-1.5 px-2.5 inline-flex items-center gap-x-1.5 text-xs font-medium rounded-md border border-gray-200 bg-white text-gray-700 shadow-sm hover:bg-gray-50 disabled:opacity-50 disabled:pointer-events-none dark:bg-slate-800 dark:border-gray-700 dark:text-white dark:hover:bg-slate-700/80">View</a>
                                            <a :href="'links.html?src=' + stream.src" class="py-1.5 px-2.5 inline-flex items-center gap-x-1.5 text-xs font-medium rounded-md border border-gray-200 bg-white text-gray-700 shadow-sm hover:bg-gray-50 disabled:opacity-50 disabled:pointer-events-none dark:bg-slate-800 dark:border-gray-700 dark:text-white dark:hover:bg-slate-700/80 ml-1.5">Links</a>
                                            <button @click.prevent="deleteStream(stream.src)" class="py-1.5 px-2.5 inline-flex items-center gap-x-1.5 text-xs font-medium rounded-md border border-transparent bg-red-500 text-white hover:bg-red-600 disabled:opacity-50 disabled:pointer-events-none ml-1.5">Delete</button>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="main.js"></script>
</body>
</html>
